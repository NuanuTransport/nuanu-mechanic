<!DOCTYPE html>
<html>
<head>
<title>QR Labels - Nuanu Mechanic</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#14212b;background:#f3f5f7}
  .bar{position:sticky;top:0;z-index:2;background:#0f5e4a;color:#fff;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar b{flex:1 1 100%;font-size:16px}
  .bar input,.bar select{padding:8px;border-radius:8px;border:0;font:inherit}
  .bar button{padding:8px 14px;border-radius:8px;border:0;background:#fff;color:#0f5e4a;font-weight:700}
  .hint{padding:8px 12px;color:#5d6b76;font-size:13px}
  /* flex (not grid) so the printer never cuts a label across two pages */
  .sheet{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:12px}
  .label{background:#fff;border:1px dashed #9aa6af;break-inside:avoid;page-break-inside:avoid;overflow:hidden}

  /* ---------- vehicle / area label (portrait, unchanged look) ---------- */
  .v{width:180px;border-radius:8px;padding:10px;text-align:center}
  .v .qr{display:flex;justify-content:center;margin:4px 0 6px}
  .v .id{font-weight:800;font-size:18px;letter-spacing:.3px}
  .v .t{font-size:12px;color:#333}
  .v .brand{font-size:10px;color:#5d6b76;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

  /* ---------- spare part label: 70 mm x 30 mm, QR left, details right ---------- */
  .p{width:70mm;height:30mm;display:flex;align-items:center;gap:2mm;padding:2mm;border-radius:1.5mm}
  .p .qr{flex:0 0 26mm;width:26mm;height:26mm}
  .p .qr img,.p .qr canvas{width:26mm !important;height:26mm !important;display:block}
  .p .info{flex:1;min-width:0;height:26mm;display:flex;flex-direction:column}
  .p .name{font-size:8.5pt;line-height:1.2;font-weight:700;color:#14212b;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .p .name.long{font-size:7pt}
  .p .id{font-weight:800;font-size:11pt;line-height:1.1;letter-spacing:.2px;margin-top:1.2mm}
  .p .meta{font-size:7pt;line-height:1.2;color:#333;margin-top:.6mm}
  .p .brand{margin-top:auto}
  .p .brand{font-size:5pt;color:#5d6b76;text-transform:uppercase;letter-spacing:.4px}

  @media print{
    .bar,.hint{display:none}
    body{background:#fff}
    .sheet{padding:0;gap:3mm}
    .label{border:0.2mm dashed #999}
    @page{size:A4 portrait;margin:8mm}
  }
</style>
</head>
<body>
<div class="bar">
  <b id="h"></b>
  <input id="q" placeholder="Filter (e.g. LV23, Rack A, Tire)">
  <select id="size"><option value="140">Medium</option><option value="110">Small</option><option value="180">Large</option></select>
  <button onclick="window.print()">Print</button>
</div>
<div class="hint" id="hint"></div>
<div class="sheet" id="sheet">Loading...</div>
<script>
const TYPE = new URLSearchParams(location.search).get('type') === 'part' ? 'part' : 'vehicle';
// QR codes point to index.html in the same GitHub Pages folder, e.g. https://you.github.io/nuanu-mechanic/?v=LV23-001
const BASE = location.origin + location.pathname.replace(/[^/]*$/, '');
let ITEMS = [];
(function(){ const q = new URLSearchParams(location.search).get('q'); if (q) document.getElementById('q').value = q; })();
document.getElementById('h').textContent = TYPE === 'part' ? 'Spare part QR labels (70 x 30 mm)' : 'Vehicle and area QR labels';
document.getElementById('hint').innerHTML = '<a href="./">Back to app</a> | ' + (TYPE === 'part'
  ? 'Each label is 7 cm x 3 cm. In the print window set Scale to 100% (not "Fit to page") and Margins to Default, so the size stays exact. Cut along the dashed lines.'
  : 'Tip: open this page on a computer in Chrome, filter what you need, then Print / Save as PDF.');
if (TYPE === 'part') document.getElementById('size').style.display = 'none';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function partLabel(i, n){
  const cat = String(i.sub || '').split(' | ')[0] || '';   // type only, no location
  const name = String(i.title || '');
  return '<div class="label p"><div class="qr" id="qr' + n + '"></div><div class="info">' +
    '<div class="name' + (name.length > 55 ? ' long' : '') + '">' + esc(name) + '</div>' +
    '<div class="id">' + esc(i.id) + '</div>' +
    '<div class="meta">' + esc(cat) + '</div>' +
    '<div class="brand">Nuanu Mechanic - Spare part</div></div></div>';
}
function vehicleLabel(i, n){
  return '<div class="label v"><div class="qr" id="qr' + n + '"></div><div class="id">' + esc(i.id) + '</div>' +
    '<div class="t">' + esc([i.title, i.sub].filter(x => x && x !== '-').join(' | ')) + '</div>' +
    '<div class="brand">Nuanu Mechanic - Scan for service history</div></div>';
}
function draw(){
  const t = document.getElementById('q').value.trim().toLowerCase();
  const size = TYPE === 'part' ? 256 : +document.getElementById('size').value;
  const items = ITEMS.filter(i => !t || (i.id + ' ' + i.title + ' ' + i.sub).toLowerCase().indexOf(t) > -1);
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = items.map((i, n) => TYPE === 'part' ? partLabel(i, n) : vehicleLabel(i, n)).join('') || 'Nothing to print';
  items.forEach((i, n) => {
    const url = BASE + (TYPE === 'part' ? '?p=' : '?v=') + encodeURIComponent(i.id);
    new QRCode(document.getElementById('qr' + n), { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  });
}
document.getElementById('q').addEventListener('input', () => { clearTimeout(draw._t); draw._t = setTimeout(draw, 300); });
document.getElementById('size').addEventListener('change', draw);
fetch(window.APP_CONFIG.API_URL, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action: 'apiQrList', args: [TYPE]}) })
  .then(r => r.json())
  .then(j => { if (!j.ok) throw new Error(j.error); ITEMS = j.data; draw(); })
  .catch(e => { document.getElementById('sheet').textContent = 'Could not load list: ' + e.message; });
</script>
</body>
</html>
