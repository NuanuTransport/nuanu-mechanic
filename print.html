<!DOCTYPE html>
<html>
<head>
<title>QR Labels - Nuanu Mechanic</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#14212b;background:#f3f5f7}
  .bar{position:sticky;top:0;background:#0f5e4a;color:#fff;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar b{flex:1 1 100%;font-size:16px}
  .bar input,.bar select{padding:8px;border-radius:8px;border:0;font:inherit}
  .bar button{padding:8px 14px;border-radius:8px;border:0;background:#fff;color:#0f5e4a;font-weight:700}
  .hint{padding:8px 12px;color:#5d6b76;font-size:13px}
  .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:12px}
  .label{background:#fff;border:1px dashed #9aa6af;border-radius:8px;padding:10px;text-align:center;break-inside:avoid;page-break-inside:avoid}
  .label .qr{display:flex;justify-content:center;margin:4px 0 6px}
  .label .id{font-weight:800;font-size:18px;letter-spacing:.3px}
  .label .t{font-size:12px;color:#333;max-height:3em;overflow:hidden}
  .label .brand{font-size:10px;color:#5d6b76;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
  @media print{
    .bar,.hint{display:none}
    body{background:#fff}
    .sheet{grid-template-columns:repeat(4,1fr);gap:4mm;padding:0}
    .label{border:1px dashed #999}
    @page{size:A4;margin:8mm}
  }
</style>
</head>
<body>
<div class="bar">
  <b id="h"></b>
  <input id="q" placeholder="Filter (e.g. LV23, Luna)">
  <select id="size"><option value="140">Medium</option><option value="110">Small</option><option value="180">Large</option></select>
  <button onclick="window.print()">Print</button>
</div>
<div class="hint"><a href="./">Back to app</a> | Tip: open this page on a computer in Chrome, filter what you need, then Print / Save as PDF. If the Print button does nothing, use the browser menu Print.</div>
<div class="sheet" id="sheet">Loading...</div>
<script>
const TYPE = new URLSearchParams(location.search).get('type') === 'part' ? 'part' : 'vehicle';
// QR codes point to index.html in the same GitHub Pages folder, e.g. https://you.github.io/nuanu-mechanic/?v=LV23-001
const BASE = location.origin + location.pathname.replace(/[^/]*$/, '');
let ITEMS = [];
(function(){ const q = new URLSearchParams(location.search).get('q'); if (q) document.getElementById('q').value = q; })();
document.getElementById('h').textContent = TYPE === 'part' ? 'Spare part QR labels' : 'Vehicle and area QR labels';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function draw(){
  const t = document.getElementById('q').value.trim().toLowerCase();
  const size = +document.getElementById('size').value;
  const items = ITEMS.filter(i => !t || (i.id + ' ' + i.title + ' ' + i.sub).toLowerCase().indexOf(t) > -1);
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = items.map((i, n) => '<div class="label"><div class="qr" id="qr' + n + '"></div><div class="id">' + esc(i.id) + '</div>' +
    '<div class="t">' + esc([i.title, i.sub].filter(x => x && x !== '-').join(' | ')) + '</div>' +
    '<div class="brand">' + (TYPE === 'part' ? 'Nuanu Mechanic - Spare part' : 'Nuanu Mechanic - Scan for service history') + '</div></div>').join('') || 'Nothing to print';
  items.forEach((i, n) => {
    const url = BASE + (TYPE === 'part' ? '?p=' : '?v=') + encodeURIComponent(i.id);
    new QRCode(document.getElementById('qr' + n), { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  });
}
document.getElementById('q').addEventListener('input', () => { clearTimeout(draw._t); draw._t = setTimeout(draw, 300); });
document.getElementById('size').addEventListener('change', draw);
fetch(window.APP_CONFIG.API_URL, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action: 'apiQrList', args: [TYPE]}) })
  .then(r => r.json())
  .then(j => { if (!j.ok) throw new Error(j.error); ITEMS = j.data; draw(); })
  .catch(e => { document.getElementById('sheet').textContent = 'Could not load list: ' + e.message; });
</script>
</body>
</html>
